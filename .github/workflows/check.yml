name: Registry metadata checks
# commit/PR 自动检查已关闭以节省 Actions 用量；如需临时检查，可在 Actions 页手动触发。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - run: python -m unittest discover -s scripts/tests
